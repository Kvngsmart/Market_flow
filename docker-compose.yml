services:
  postgres:
    image: postgres:16-alpine
    container_name: marketflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketflow
    ports:
      - "5432:5432"
    volumes:
      - marketflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: marketflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - marketflow-redis:/data

volumes:
  marketflow-postgres:
  marketflow-redis:
